<!doctype html>
<html><body>
<h1>Global Search</h1>
<span id="ctl00_PlaceHolderMain_lblSearchResults">Search Results</span>
<table id="ctl00_PlaceHolderMain_gdvPermitList"><tbody id="results"></tbody></table>
<script>
  const pages = ["HC-BLD-26-0000111", "HC-BLD-26-0000222", "HC-BLD-26-0000123"];
  let currentPage = 0;
  const record = "https://aca-prod.accela.com/HCFL/Cap/CapDetail.aspx?Module=Building&TabName=Building&capID1=26CAP&capID2=00000&capID3=01Y33&agencyCode=HCFL";
  function showPage() {
    document.querySelector("#results").innerHTML =
      `<tr><td><a id="row_lnkPermitNumber" href="${record}">${pages[currentPage]}</a></td></tr>` +
      `<tr><td><span id="current-page">${currentPage + 1}</span>` +
      (currentPage < 2 ? `<a href="javascript:__doPostBack('gdvPermitList','Page$Next')">Next &gt;</a>` : "") + "</td></tr>";
  }
  function __doPostBack() { currentPage += 1; showPage(); }
  showPage();
</script>
</body></html>
