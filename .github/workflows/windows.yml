name: Windows package

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match package version $version." }
      - run: npm ci --allow-git=all
      - run: npm run typecheck
      - run: npm test
      - run: npm run browser:stage
      - run: npm run make:win
      - name: Test packaged browser HTTPS path
        shell: pwsh
        run: '& "out/Permit Monitor-win32-x64/PermitMonitor.exe" --smoke-browser; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/make/squirrel.windows/x64/*
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd installer
          sha256sum PermitMonitorSetup.exe > PermitMonitorSetup.exe.sha256
          cat > notes.md <<'EOF'
          ## Install

          Download `PermitMonitorSetup.exe` and run it. It installs for the current user only and doesn't need admin rights.

          This installer isn't code-signed, so Windows SmartScreen will say **"Windows protected your PC."** Click **More info**, then **Run anyway**. If your browser flags the download, choose **Keep**.

          To confirm the download, compare `Get-FileHash PermitMonitorSetup.exe` in PowerShell with the `.sha256` file.

          ## Updating

          Unsigned builds can't update themselves in the app. To update, download the newer installer and run it over the current install. Your permits and history are kept.
          EOF
          gh release create "$GITHUB_REF_NAME" PermitMonitorSetup.exe PermitMonitorSetup.exe.sha256 \
            --title "Permit Monitor $GITHUB_REF_NAME" --notes-file notes.md --prerelease --verify-tag
