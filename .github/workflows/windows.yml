name: Package

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

# A newer push to the same pull request replaces its run. Branch and tag runs always finish.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publication-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --allow-git=all --ignore-scripts
      # These tests use local buckets and executables, need no release credentials, and cannot publish.
      - run: npm test -- tests/publish-feed.test.ts tests/publish-update.test.ts tests/update-server.test.ts

  package:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      UPDATE_FEED_URL: https://permitmon-updates.sc-frederick.workers.dev/release-manifest.json
      UPDATE_PUBLIC_KEY_SPKI_BASE64: MCowBQYDK2VwAyEApu+hz0nmtlIiFeBQQz4vtoqthXAi13VyC1EoXN7rtbc=
      # Shared lists (infra/sync-server). The Sync server workflow deploys that Worker when it changes on master; check
      # that its run passed before tagging a release built with this.
      SHARE_SERVICE_URL: https://permitmon-sync.sc-frederick.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      # The checkout turns an annotated tag into a lightweight one, so the tag's type is read from GitHub.
      - name: Check tag matches package version and is annotated
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match package version $version." }
          $type = gh api "repos/${env:GITHUB_REPOSITORY}/git/ref/tags/${env:GITHUB_REF_NAME}" --jq .object.type
          if ($LASTEXITCODE -ne 0) { throw "Could not read tag ${env:GITHUB_REF_NAME} from GitHub." }
          if ($type -ne "tag") { throw "Tag ${env:GITHUB_REF_NAME} is lightweight. Delete it and push an annotated one (docs/RELEASE.md)." }
      - run: npm ci --allow-git=all
      - run: npm run typecheck
      - run: npm run lint
      # Renderer and worker tests run in the staged browser.
      - run: npm run browser:stage
      - run: npm test -- --exclude tests/history-growth.test.ts
      # Keep the 100 ms responsiveness budget without competing with parallel browser/SQLite test workers.
      - run: npm run benchmark:history
      - run: npm run make:win
      - name: Test packaged browser HTTPS path
        shell: pwsh
        run: '& "out/Permit Monitor-win32-x64/PermitMonitor.exe" --smoke-browser; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
      # The installer is ~280 MB and artifact storage is billed. Keep it only for tag releases (the release job
      # downloads it) and manual runs. Setup.exe embeds the full .nupkg, so upload the installer alone.
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: windows-installer
          path: out/make/squirrel.windows/x64/PermitMonitorSetup.exe
          retention-days: 1
          compression-level: 0

  # The Mac app is signed ad hoc (no Apple Developer ID), so Gatekeeper blocks it until the user allows it once; see
  # docs/RELEASE.md. macOS runners use ten times the minutes of Linux ones, so this runs for releases and manual runs only.
  package-mac:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      UPDATE_FEED_URL: https://permitmon-updates.sc-frederick.workers.dev/release-manifest.json
      UPDATE_PUBLIC_KEY_SPKI_BASE64: MCowBQYDK2VwAyEApu+hz0nmtlIiFeBQQz4vtoqthXAi13VyC1EoXN7rtbc=
      SHARE_SERVICE_URL: https://permitmon-sync.sc-frederick.workers.dev
      APP: out/Permit Monitor-darwin-arm64/Permit Monitor.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --allow-git=all
      # Renderer and worker tests run in the staged browser, which is the Mac headless shell here.
      - run: npm run browser:stage
      - run: npm test -- --exclude tests/history-growth.test.ts
      # Run the timing benchmark alone; its latency limit and retained-history assertions remain unchanged.
      - run: npm run benchmark:history
      - run: npm run package:mac
      # Packaging edits Electron's Info.plist, which breaks the bundle's seal, and Gatekeeper calls an app with a broken
      # seal "damaged" with no way to open it. An ad hoc signature reseals it. The browser payload stays as it was.
      - name: Sign ad hoc
        run: |
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Test packaged browser HTTPS path
        run: '"$APP/Contents/MacOS/PermitMonitor" --smoke-browser'
      # ditto keeps the framework symlinks and permissions that a plain zip would lose.
      - name: Zip the app
        run: |
          mkdir -p out/make
          ditto -c -k --sequesterRsrc --keepParent "$APP" out/make/PermitMonitor-mac-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: mac-app
          path: out/make/PermitMonitor-mac-arm64.zip
          retention-days: 1
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, package-mac, publication-tests]
    # Pinned so ubuntu-latest's move to 26.04 doesn't change the release image unannounced.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One publication to the shared feed at a time, across all tags. GitHub keeps only the newest waiting run
    # in a group and cancels an older waiting one; rerun a cancelled tag's release job after the newer one ends.
    concurrency:
      group: update-feed-publication
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      UPDATE_SERVER_URL: https://permitmon-updates.sc-frederick.workers.dev
      UPDATE_PUBLIC_KEY_SPKI_BASE64: MCowBQYDK2VwAyEApu+hz0nmtlIiFeBQQz4vtoqthXAi13VyC1EoXN7rtbc=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      # The publication script parses what it reads from the feed with zod. Nothing here needs install scripts.
      - run: npm ci --allow-git=all --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: out/make/squirrel.windows/x64
      - uses: actions/download-artifact@v8
        with:
          name: mac-app
          path: out/make
      - name: Sign update manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          key_file="$RUNNER_TEMP/update-signing-key.pem"
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_PRIVATE_KEY" > "$key_file")
          UPDATE_SIGNING_PRIVATE_KEY_FILE="$key_file" \
            UPDATE_INSTALLER_URL="$UPDATE_SERVER_URL/PermitMonitorSetup-${GITHUB_REF_NAME#v}.exe" \
            node scripts/sign-release-manifest.mjs
          rm -f "$key_file"
      # Cloudflare challenges GitHub runner IPs on the Worker hosts, so CI writes to R2's S3 endpoint
      # directly. Installer first, manifest last. publish-feed.mjs never replaces a versioned installer with
      # other bytes and only moves the manifest to a newer version (infra/update-server/src/release-policy.ts).
      - name: Publish to update feed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          R2_ENDPOINT: https://838798e8498ddea23910e8e812f26c17.r2.cloudflarestorage.com
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::R2 credentials are not set; publish this release to the update feed with scripts/publish-update.mjs (docs/RELEASE.md)."
            exit 0
          fi
          node scripts/publish-feed.mjs
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mac_zip="PermitMonitor-$version-mac-arm64.zip"
          cp out/make/PermitMonitor-mac-arm64.zip "out/make/squirrel.windows/x64/$mac_zip"
          cd out/make/squirrel.windows/x64
          sha256sum PermitMonitorSetup.exe > PermitMonitorSetup.exe.sha256
          sha256sum "$mac_zip" > "$mac_zip.sha256"
          cat > notes.md <<'EOF'
          ## Install

          Download the installer from https://permitmon-updates.aeccloud.io/ (always the latest version) and run it. It installs for the current user only and doesn't need admin rights.

          This installer isn't code-signed, so Windows SmartScreen will say **"Windows protected your PC."** Click **More info**, then **Run anyway**. If your browser flags the download, choose **Keep**.

          To confirm the download, compare `Get-FileHash PermitMonitorSetup-*.exe` in PowerShell with the `.sha256` file.

          ## Mac (Apple silicon)

          Download https://permitmon-updates.aeccloud.io/mac, open the zip, and drag **Permit Monitor** to Applications. The app isn't signed by Apple, so macOS blocks it the first time. In Terminal, run:

              xattr -dr com.apple.quarantine "/Applications/Permit Monitor.app"

          Then open it as usual. (**Open Anyway** in Privacy & Security lets the app start but not the browser inside it, so use the command.) The first time the app saves your TypeSafe key, macOS asks to use the Keychain; enter your Mac password and click **Always Allow**. Mac updates are downloaded by hand: **Settings → Updates** says when one is out, and the steps above apply again.

          ## Updating

          From 0.2.0 on, open **Settings → Updates → Check for updates** to download and install new versions in the app. Your permits and history are kept.
          EOF
          gh release create "$GITHUB_REF_NAME" PermitMonitorSetup.exe PermitMonitorSetup.exe.sha256 "$mac_zip" "$mac_zip.sha256" release-manifest.json \
            --title "Permit Monitor $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
