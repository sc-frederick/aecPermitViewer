name: Sync server

# Deploys the shared-list Worker (infra/sync-server) whenever it or the protocol it shares with the app changes on
# master, so it is always live before a release that relies on it is tagged. Pull requests only bundle it.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - infra/sync-server/**
      - src/shared/share-protocol.ts
      - tests/sync-server.test.ts
      - .github/workflows/sync-server.yml
  pull_request:
    paths:
      - infra/sync-server/**
      - src/shared/share-protocol.ts
      - tests/sync-server.test.ts
      - .github/workflows/sync-server.yml

# Deploys run one at a time; a newer push to the same pull request replaces its run.
concurrency:
  group: sync-server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      # The Worker bundles zod from the root node_modules. Nothing here needs install scripts.
      - run: npm ci --allow-git=all --ignore-scripts
      - run: npx tsc --noEmit -p infra/sync-server
      - run: npx vitest run tests/sync-server.test.ts
      - name: Bundle without deploying
        if: github.event_name == 'pull_request'
        working-directory: infra/sync-server
        run: node cloudflare-cli/run.mjs dry-run --skip-prepare
      # cf uses the existing account and deployment token. The toolchain is pinned in cloudflare-cli/app.
      - name: Deploy
        if: github.event_name != 'pull_request'
        working-directory: infra/sync-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SYNC_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 838798e8498ddea23910e8e812f26c17
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_SYNC_DEPLOY_TOKEN is not set; deploy by hand with node cloudflare-cli/run.mjs deploy (cloudflare-cli/README.md)."
            exit 1
          fi
          node cloudflare-cli/run.mjs deploy --message "$GITHUB_SHA"
