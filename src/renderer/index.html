<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Permit Monitor</title>
  <link rel="stylesheet" href="styles.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-doc" viewBox="0 0 20 20"><path d="M4.5 17.5v-15h11v15h-11ZM7.5 7h5M7.5 10h5M7.5 13h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-key" viewBox="0 0 20 20"><circle cx="7" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10h7M15 10v2.5M17.5 10v2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-external" viewBox="0 0 20 20"><path d="M11.5 3.5h5v5M16.5 3.5 9 11M14 11.5v5h-10.5v-10.5h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 20 20"><path d="m4.5 10.5 3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-alert" viewBox="0 0 20 20"><path d="M10 3 17.5 16.5h-15L10 3Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 8.5v3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="14.2" r=".95" fill="currentColor"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <h1 class="brand"><svg class="brand-mark" aria-hidden="true"><use href="#i-doc"/></svg>Permit Monitor</h1>
        <button id="open-settings" class="button button-quiet" type="button"><svg class="icon" aria-hidden="true"><use href="#i-gear"/></svg>Settings</button>
      </div>
    </header>

    <main>
      <section id="key-banner" class="banner" aria-labelledby="key-banner-title" hidden>
        <svg class="banner-icon" aria-hidden="true"><use href="#i-key"/></svg>
        <h2 id="key-banner-title" class="banner-copy">Add your TypeSafe key to run checks.</h2>
        <button id="banner-add-key" class="button button-primary" type="button">Add key</button>
      </section>

      <section class="card add-card" aria-label="Add a permit">
        <form id="add-form" novalidate>
          <div class="field jurisdiction-field">
            <label for="jurisdiction">Jurisdiction</label>
            <select id="jurisdiction" name="jurisdiction" required>
              <option value="Hillsborough County government · Building">Hillsborough County · Building</option>
            </select>
          </div>
          <div class="field number-field">
            <label for="permit-number">Permit number</label>
            <input id="permit-number" name="permitNumber" type="text" autocomplete="off" spellcheck="false" placeholder="HC-BLD-26-0087599" required maxlength="80" aria-describedby="permit-number-error">
          </div>
          <button id="add-button" class="button button-primary add-button" type="submit">Add permit</button>
        </form>
        <p id="permit-number-error" class="field-error" hidden></p>
      </section>

      <section class="list-section" aria-labelledby="list-title">
        <div class="list-heading"><h2 id="list-title">Permits</h2><p id="next-check"></p></div>
        <div class="card table-card">
          <div class="table-toolbar">
            <div class="filters" role="group" aria-label="Filter permits">
              <button type="button" class="filter" data-filter="all" aria-pressed="true">All <span class="filter-count" data-count="all"></span></button>
              <button type="button" class="filter" data-filter="failed" aria-pressed="false">Failed <span class="filter-count" data-count="failed"></span></button>
              <button type="button" class="filter" data-filter="unverified" aria-pressed="false">No status yet <span class="filter-count" data-count="unverified"></span></button>
            </div>
            <div class="monitoring-control">
              <label for="monitoring-mode">Schedule</label>
              <select id="monitoring-mode"><option value="scheduled">3 times a day</option><option value="manual">Manual only</option></select>
            </div>
          </div>
          <table id="permit-table">
            <thead><tr><th scope="col">Permit</th><th scope="col">Status</th><th scope="col">Verified</th><th scope="col">Last check</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
            <tbody id="permit-list"></tbody>
          </table>
          <p id="empty-state" class="empty-state">No permits yet.</p>
        </div>
      </section>
    </main>
  </div>

  <dialog id="details-sheet" class="sheet" aria-labelledby="details-title">
    <div class="sheet-header">
      <h2 id="details-title">Permit</h2>
      <button class="icon-button" type="button" data-close aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body">
      <div class="detail-summary">
        <div><strong id="details-status" class="detail-status"></strong><span id="details-observed" class="detail-meta"></span><span id="details-failure" class="detail-meta warn" hidden></span></div>
        <div class="detail-actions">
          <button id="details-check" class="button button-secondary" type="button">Check now</button>
          <button id="details-open" class="button button-secondary" type="button"><svg class="icon" aria-hidden="true"><use href="#i-external"/></svg>Open record</button>
        </div>
        <label class="switch-row"><input id="details-daily" type="checkbox"><span><strong>Include in scheduled checks</strong><small id="details-daily-help"></small></span></label>
      </div>
      <h3 class="timeline-title">History</h3>
      <ol id="history-list" class="timeline"></ol>
      <button id="details-remove" class="link-button danger-link" type="button">Remove permit</button>
    </div>
  </dialog>

  <dialog id="settings-sheet" class="sheet" aria-labelledby="settings-title">
    <div class="sheet-header">
      <h2 id="settings-title">Settings</h2>
      <button class="icon-button" type="button" data-close aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body settings-body">
      <section aria-labelledby="settings-key-title">
        <h3 id="settings-key-title">TypeSafe key</h3>
        <p id="settings-key-state" hidden></p>
        <form id="key-form" class="key-form" novalidate>
          <label for="key-input" class="visually-hidden">TypeSafe API key</label>
          <div class="key-row">
            <input id="key-input" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" maxlength="512" placeholder="Paste your API key" aria-describedby="key-error">
            <button id="key-save" class="button button-primary" type="submit">Save</button>
          </div>
          <p id="key-error" class="field-error" hidden></p>
        </form>
        <button id="key-remove" class="link-button danger-link" type="button" hidden>Remove key</button>
      </section>
      <section aria-labelledby="settings-background-title">
        <h3 id="settings-background-title">Background &amp; notifications</h3>
        <div class="pref-list">
          <label class="switch-row"><input type="checkbox" data-pref="runInBackground"><span><strong>Keep running in the tray when closed</strong></span></label>
          <label class="switch-row"><input type="checkbox" data-pref="openAtLogin"><span><strong>Start at Windows sign-in</strong></span></label>
          <label class="switch-row"><input type="checkbox" data-pref="notifyStatusChanges"><span><strong>Notify when a status changes</strong></span></label>
          <label class="switch-row"><input type="checkbox" data-pref="notifyFailures"><span><strong>Notify when a check fails</strong></span></label>
        </div>
      </section>
      <section aria-labelledby="settings-update-title">
        <h3 id="settings-update-title">Updates</h3>
        <p id="update-status" aria-live="polite" hidden></p>
        <div class="settings-actions">
          <button id="check-update" class="button button-secondary" type="button">Check for updates</button>
          <button id="download-update" class="button button-secondary" type="button" hidden>Download</button>
          <button id="install-update" class="button button-primary" type="button" hidden>Install</button>
        </div>
      </section>
      <section aria-labelledby="settings-data-title">
        <h3 id="settings-data-title">Data</h3>
        <button id="delete-local-data" class="button button-danger" type="button">Delete all data</button>
      </section>
      <p id="version" class="version"></p>
    </div>
  </dialog>

  <dialog id="confirm-dialog" class="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="confirm-actions">
        <button class="button button-secondary" value="cancel" type="submit" autofocus>Cancel</button>
        <button id="confirm-accept" class="button button-danger-solid" value="accept" type="submit"></button>
      </div>
    </form>
  </dialog>

  <div id="notice" class="notice" role="status" aria-live="polite" hidden><svg class="icon" aria-hidden="true"><use id="notice-icon" href="#i-check"/></svg><span id="notice-text"></span></div>
</body>
</html>
