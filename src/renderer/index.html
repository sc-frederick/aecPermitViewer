<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Permit Monitor</title>
  <link rel="stylesheet" href="styles.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <!-- Icons: Lucide (https://lucide.dev), ISC License, Copyright (c) Lucide Icons and Contributors. -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="nav">
      <div class="container nav-inner">
        <h1 class="mark"><img class="mark-icon" src="assets/icon.svg" alt="" width="22" height="22"><span class="mark-wordmark">Permit <em>Monitor</em></span></h1>
        <div class="nav-actions">
          <p id="next-check" class="coord"></p>
          <button id="open-settings" class="btn btn-ghost" type="button"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-settings"/></svg>Settings</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section id="key-banner" class="banner" aria-labelledby="key-banner-title" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-key"/></svg>
        <h2 id="key-banner-title" class="banner-copy">Add your TypeSafe key to run checks.</h2>
        <button id="banner-add-key" class="btn btn-primary btn-sm" type="button">Add key</button>
      </section>

      <section class="card add-card" aria-label="Add a permit">
        <form id="add-form" novalidate>
          <div class="field jurisdiction-field">
            <label class="field-label" for="jurisdiction">Jurisdiction</label>
            <select id="jurisdiction" class="field-control" name="jurisdiction" required></select>
          </div>
          <div class="field number-field">
            <label class="field-label" for="permit-number">Permit number</label>
            <input id="permit-number" class="field-control mono-input" name="permitNumber" type="text" autocomplete="off" spellcheck="false" placeholder="HC-BLD-26-0087599" required maxlength="80" aria-describedby="permit-number-error">
          </div>
          <button id="add-button" class="btn btn-primary" type="submit">Add permit</button>
          <div class="field filter-field">
            <label class="field-label" for="permit-filter">Show</label>
            <select id="permit-filter" class="field-control">
              <option value="all" data-label="All permits">All permits</option>
              <option value="failed" data-label="Failed">Failed</option>
              <option value="unverified" data-label="No status yet">No status yet</option>
            </select>
          </div>
        </form>
        <p id="permit-number-error" class="field-error" hidden></p>
        <p id="jurisdiction-help" class="field-note"></p>
      </section>

      <section class="card table-card" aria-label="Permits">
        <table id="permit-table" class="table">
          <thead><tr><th scope="col">Permit</th><th scope="col">Status</th><th scope="col">Verified</th><th scope="col">Last check</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
          <tbody id="permit-list"></tbody>
        </table>
        <p id="empty-state" class="empty-state">No permits yet.</p>
      </section>
    </main>
  </div>

  <dialog id="details-sheet" class="sheet" aria-labelledby="details-title">
    <div class="sheet-header">
      <div>
        <p id="details-jurisdiction" class="coord"></p>
        <h2 id="details-title" class="sheet-title mono-title">Permit</h2>
      </div>
      <button class="icon-button" type="button" data-close aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body">
      <div class="detail-summary">
        <div class="detail-status-block">
          <strong id="details-status" class="detail-status"></strong>
          <span id="details-observed" class="detail-meta"></span>
          <span id="details-failure" class="detail-meta failed" hidden></span>
        </div>
        <div class="detail-actions">
          <button id="details-check" class="btn btn-primary" type="button">Check now</button>
          <button id="details-open" class="btn btn-secondary" type="button"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-external"/></svg>Open record</button>
        </div>
        <label class="checkbox"><input id="details-daily" class="checkbox-input" type="checkbox"><span class="checkbox-box" aria-hidden="true"></span><span class="checkbox-text"><strong>Include in scheduled checks</strong><small id="details-daily-help"></small></span></label>
      </div>
      <div class="rule-head"><h3 class="sheet-section-title">History</h3></div>
      <ol id="history-list" class="timeline"></ol>
      <button id="details-remove" class="btn btn-ghost remove-link" type="button"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-trash"/></svg>Remove permit</button>
    </div>
  </dialog>

  <dialog id="settings-sheet" class="sheet" aria-labelledby="settings-title">
    <div class="sheet-header">
      <h2 id="settings-title" class="sheet-title">Settings</h2>
      <button class="icon-button" type="button" data-close aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body settings-body">
      <section aria-labelledby="settings-key-title">
        <h3 id="settings-key-title" class="sheet-section-title">TypeSafe key</h3>
        <p id="settings-key-state" hidden></p>
        <form id="key-form" class="key-form" novalidate>
          <div class="field">
            <label for="key-input" class="visually-hidden">TypeSafe API key</label>
            <div class="key-row">
              <input id="key-input" class="field-control" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" maxlength="512" placeholder="Paste your API key" aria-describedby="key-error">
              <button id="key-save" class="btn btn-primary btn-sm" type="submit">Save</button>
            </div>
            <p id="key-error" class="field-error" hidden></p>
          </div>
        </form>
        <button id="key-remove" class="btn btn-ghost remove-link" type="button" hidden>Remove key</button>
      </section>
      <section aria-labelledby="settings-schedule-title">
        <h3 id="settings-schedule-title" class="sheet-section-title">Schedule</h3>
        <p id="schedule-help"></p>
        <div class="field">
          <label for="monitoring-mode" class="visually-hidden">Schedule</label>
          <select id="monitoring-mode" class="field-control settings-select"><option value="scheduled">Automatic</option><option value="manual">Manual only</option></select>
        </div>
        <div id="check-times" class="check-times">
          <ul id="check-time-list" class="check-time-list" aria-label="Check times"></ul>
          <button id="add-check-time" class="btn btn-ghost" type="button"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-plus"/></svg>Add time</button>
        </div>
      </section>
      <section aria-labelledby="settings-background-title">
        <h3 id="settings-background-title" class="sheet-section-title">Background &amp; notifications</h3>
        <div class="pref-list">
          <label class="checkbox"><input class="checkbox-input" type="checkbox" data-pref="runInBackground"><span class="checkbox-box" aria-hidden="true"></span><span class="checkbox-text"><strong>Keep running in the tray when closed</strong></span></label>
          <label class="checkbox"><input class="checkbox-input" type="checkbox" data-pref="openAtLogin"><span class="checkbox-box" aria-hidden="true"></span><span class="checkbox-text"><strong>Start at Windows sign-in</strong></span></label>
          <label class="checkbox"><input class="checkbox-input" type="checkbox" data-pref="notifyStatusChanges"><span class="checkbox-box" aria-hidden="true"></span><span class="checkbox-text"><strong>Notify when a status changes</strong></span></label>
          <label class="checkbox"><input class="checkbox-input" type="checkbox" data-pref="notifyFailures"><span class="checkbox-box" aria-hidden="true"></span><span class="checkbox-text"><strong>Notify when a check fails</strong></span></label>
        </div>
      </section>
      <section aria-labelledby="settings-update-title">
        <h3 id="settings-update-title" class="sheet-section-title">Updates</h3>
        <p id="update-status" aria-live="polite" hidden></p>
        <div class="settings-actions">
          <button id="check-update" class="btn btn-secondary btn-sm" type="button">Check for updates</button>
          <button id="download-update" class="btn btn-secondary btn-sm" type="button" hidden>Download</button>
          <button id="install-update" class="btn btn-primary btn-sm" type="button" hidden>Install</button>
        </div>
      </section>
      <section aria-labelledby="settings-data-title">
        <h3 id="settings-data-title" class="sheet-section-title">Data</h3>
        <button id="delete-local-data" class="btn btn-secondary btn-sm" type="button"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-trash"/></svg>Delete all data</button>
      </section>
      <p id="version" class="coord version"></p>
    </div>
  </dialog>

  <dialog id="confirm-dialog" class="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <form method="dialog">
      <h2 id="confirm-title" class="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" value="cancel" type="submit" autofocus>Cancel</button>
        <button id="confirm-accept" class="btn btn-primary" value="accept" type="submit"></button>
      </div>
    </form>
  </dialog>

  <div id="notice" class="notice" role="status" aria-live="polite" hidden><svg class="icon icon-sm" aria-hidden="true"><use id="notice-icon" href="#i-check"/></svg><span id="notice-text"></span></div>
</body>
</html>
